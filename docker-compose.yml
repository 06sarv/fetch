x-agent-base: &agent-base
  build: ./backend
  env_file:
    - ./backend/.env
  command: ["uvicorn", "app.agent_service:app", "--host", "0.0.0.0", "--port", "8100"]
  environment:
    DATA_DIR: /tmp/fetch
    FETCH_STORAGE_URL: http://api:8000
    FETCH_INTERNAL_TOKEN: ${FETCH_INTERNAL_TOKEN:-fetch-local-agent-token}
  expose:
    - "8100"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
    interval: 15s
    timeout: 3s
    retries: 3

services:
  otto:
    <<: *agent-base
    environment:
      AGENT_ROLE: otto
      DATA_DIR: /tmp/fetch
      FETCH_STORAGE_URL: http://api:8000
      FETCH_INTERNAL_TOKEN: ${FETCH_INTERNAL_TOKEN:-fetch-local-agent-token}
  scout:
    <<: *agent-base
    environment:
      AGENT_ROLE: scout
      DATA_DIR: /tmp/fetch
      FETCH_STORAGE_URL: http://api:8000
      FETCH_INTERNAL_TOKEN: ${FETCH_INTERNAL_TOKEN:-fetch-local-agent-token}
  forger:
    <<: *agent-base
    environment:
      AGENT_ROLE: forger
      DATA_DIR: /tmp/fetch
      FETCH_STORAGE_URL: http://api:8000
      FETCH_INTERNAL_TOKEN: ${FETCH_INTERNAL_TOKEN:-fetch-local-agent-token}
  engineer:
    <<: *agent-base
    environment:
      AGENT_ROLE: engineer
      DATA_DIR: /tmp/fetch
      FETCH_STORAGE_URL: http://api:8000
      FETCH_INTERNAL_TOKEN: ${FETCH_INTERNAL_TOKEN:-fetch-local-agent-token}
  assembler:
    <<: *agent-base
    environment:
      AGENT_ROLE: assembler
      DATA_DIR: /tmp/fetch
      FETCH_STORAGE_URL: http://api:8000
      FETCH_INTERNAL_TOKEN: ${FETCH_INTERNAL_TOKEN:-fetch-local-agent-token}
  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATA_DIR: /var/lib/fetch
      PORT: 8000
      API_CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
      MAX_UPLOAD_MB: 25
      MAX_JOBS_PER_HOUR: 5
      FETCH_INTERNAL_TOKEN: ${FETCH_INTERNAL_TOKEN:-fetch-local-agent-token}
      OTTO_URL: http://otto:8100
      SCOUT_URL: http://scout:8100
      FORGER_URL: http://forger:8100
      ENGINEER_URL: http://engineer:8100
      ASSEMBLER_URL: http://assembler:8100
    volumes:
      - fetch-data:/var/lib/fetch
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      otto: {condition: service_healthy}
      scout: {condition: service_healthy}
      forger: {condition: service_healthy}
      engineer: {condition: service_healthy}
      assembler: {condition: service_healthy}
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
    expose:
      - "3000"
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "3002:8080"
volumes:
  fetch-data:
