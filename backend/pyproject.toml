[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fetch-dataset-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pandas>=2.2,<3", "numpy>=1.26,<3", "openpyxl>=3.1,<4", "httpx>=0.27,<1", "python-dotenv>=1.0,<2", "langgraph>=0.2,<2", "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
